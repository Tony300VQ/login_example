<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Moderno</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.95);
            border: none;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            padding: 2rem;
        }

        .form-control {
            border-radius: 10px;
            padding: 12px;
            border: 1px solid #ddd;
            transition: all 0.3s;
        }

        .form-control:focus {
            box-shadow: 0 0 10px rgba(118, 75, 162, 0.2);
            border-color: #764ba2;
        }

        .btn-custom {
            background: linear-gradient(to right, #667eea, #764ba2);
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
            color: white;
            transition: transform 0.2s;
        }

        .btn-custom:hover {
            transform: translateY(-2px);
            color: white;
            opacity: 0.9;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h2 {
            font-weight: 700;
            color: #333;
        }

        .login-header p {
            color: #777;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div class="container d-flex justify-content-center">
    <div class="login-card">
        <div class="login-header">
            <h2>Bienvenido</h2>
            <p>Ingresa tus credenciales para continuar</p>
        </div>

        <form>
            <!-- Usuario -->
            <div class="mb-4">
                <label class="form-label fw-bold">Usuario o Email</label>
                <input type="text" class="form-control" placeholder="ejemplo@correo.com" required>
            </div>

            <!-- Contraseña -->
            <div class="mb-4">
                <label class="form-label fw-bold">Contraseña</label>
                <input type="password" class="form-control" placeholder="••••••••" required>
            </div>

            <!-- Recordarme y Olvido -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="remember">
                    <label class="form-check-label small text-muted" for="remember">Recordarme</label>
                </div>
                <a href="#" class="small text-decoration-none" style="color: #764ba2;">¿Olvidaste la clave?</a>
            </div>

            <!-- Botón -->
            <div class="d-grid">
                <button type="submit" class="btn btn-custom">Iniciar Sesión</button>
            </div>
        </form>

        <div class="text-center mt-4">
            <p class="small text-muted">¿No tienes cuenta? <a href="#" class="text-decoration-none fw-bold" style="color: #667eea;">Regístrate</a></p>
        </div>
    </div>
</div>

</body>
</html>
